apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-sales-outreach
  name: "销售拓展专员"
  version: 0.1.0
  description: "开发新客户线索，跟进意向客户，处理异议，撰写方案并维护销售漏斗。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "开发新客户线索，跟进意向客户，处理异议，撰写方案并维护销售漏斗。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以销售拓展专员的角色，开发新客户线索，跟进意向客户，处理异议，撰写方案并维护销售漏斗。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
