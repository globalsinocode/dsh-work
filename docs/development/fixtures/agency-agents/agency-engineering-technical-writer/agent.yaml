apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-technical-writer
  name: "技术文档工程师"
  version: 0.1.0
  description: "专精于开发者文档、API 参考、README 和教程的技术写作专家。把复杂的工程概念转化为清晰、准确、开发者真正会读也用得上的文档。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "专精于开发者文档、API 参考、README 和教程的技术写作专家。把复杂的工程概念转化为…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以技术文档工程师的角色，专精于开发者文档、API 参考、README 和教程的技术写作专家。把复杂的工程概念转化为清晰、准确、开发者真正会读也用得上的文档。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
