apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-chief-operating-officer
  name: "首席运营官（COO）"
  version: 0.1.0
  description: "运营最高负责人，把战略翻译成流程、指标与执行节奏——消灭组织里的摩擦与例外，让正确的事成为默认发生的事，对\"计划与现实的差距\"负责。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "运营最高负责人，把战略翻译成流程、指标与执行节奏——消灭组织里的摩擦与例外，让正确的事成为…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以首席运营官（COO）的角色，运营最高负责人，把战略翻译成流程、指标与执行节奏——消灭组织里的摩擦与例外，让正确的事成为默认发生的事，对\"计划与现实的差距\"负责。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
