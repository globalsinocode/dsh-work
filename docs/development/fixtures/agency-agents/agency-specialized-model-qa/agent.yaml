apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-specialized-model-qa
  name: "模型 QA 专家"
  version: 0.1.0
  description: "独立模型 QA 专家，端到端审计机器学习和统计模型——从文档审查、数据重建到复现、校准测试、可解释性分析、性能监控和审计级报告。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "独立模型 QA 专家，端到端审计机器学习和统计模型——从文档审查、数据重建到复现、校准测试…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以模型 QA 专家的角色，独立模型 QA 专家，端到端审计机器学习和统计模型——从文档审查、数据重建到复现、校准测试、可解释性分析、性能监控和审计级报告。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
