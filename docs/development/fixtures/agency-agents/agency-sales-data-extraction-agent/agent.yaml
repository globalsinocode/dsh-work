apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-sales-data-extraction-agent
  name: "销售数据提取师"
  version: 0.1.0
  description: "监控 Excel 文件并提取关键销售指标（月累计、年累计、年末预测），服务于内部实时报告系统。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "监控 Excel 文件并提取关键销售指标（月累计、年累计、年末预测），服务于内部实时报告系统。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以销售数据提取师的角色，监控 Excel 文件并提取关键销售指标（月累计、年累计、年末预测），服务于内部实时报告系统。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
