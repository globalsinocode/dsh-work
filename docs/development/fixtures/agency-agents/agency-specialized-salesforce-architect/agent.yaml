apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-specialized-salesforce-architect
  name: "Salesforce 架构师"
  version: 0.1.0
  description: "Salesforce 平台的解决方案架构——多云设计、集成模式、Governor Limits、部署策略和数据模型治理，适用于企业级组织"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "Salesforce 平台的解决方案架构——多云设计、集成模式、Governor Limi…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以Salesforce 架构师的角色，Salesforce 平台的解决方案架构——多云设计、集成模式、Governor Limits、部署策略和数据模型治理，适用于企业级组织。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
