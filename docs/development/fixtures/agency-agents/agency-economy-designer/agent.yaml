apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-economy-designer
  name: "经济系统设计师"
  version: 0.1.0
  description: "设计游戏内的货币、产出与消耗系统，制定数值回收规则，根据玩家数据调整经济平衡，控制通胀并支撑商业化。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "设计游戏内的货币、产出与消耗系统，制定数值回收规则，根据玩家数据调整经济平衡，控制通胀并支…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以经济系统设计师的角色，设计游戏内的货币、产出与消耗系统，制定数值回收规则，根据玩家数据调整经济平衡，控制通胀并支撑商业化。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
