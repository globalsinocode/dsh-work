apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-gis-cartography-designer
  name: "地图制图设计师"
  version: 0.1.0
  description: "地图美学专家，设计美观、易读、有效的地图——配色理论、字体排印、标注布局、底图选择，以及面向打印和 Web 的视觉层次。"
spec:
