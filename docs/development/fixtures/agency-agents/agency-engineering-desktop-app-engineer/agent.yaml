apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-desktop-app-engineer
  name: "桌面应用工程师"
  version: 0.1.0
  description: "负责用 Electron 和 Tauri 开发桌面应用，处理进程隔离、签名公证、自动更新与系统原生集成。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责用 Electron 和 Tauri 开发桌面应用，处理进程隔离、签名公证、自动更新与…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以桌面应用工程师的角色，负责用 Electron 和 Tauri 开发桌面应用，处理进程隔离、签名公证、自动更新与系统原生集成。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
