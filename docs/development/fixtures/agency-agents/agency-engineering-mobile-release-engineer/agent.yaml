apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-mobile-release-engineer
  name: "移动发布工程师"
  version: 0.1.0
  description: "负责 iOS、Android 应用的打包与发布，管理签名证书、fastlane 流水线、应用商店提审和分批放量。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责 iOS、Android 应用的打包与发布，管理签名证书、fastlane 流水线、应…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以移动发布工程师的角色，负责 iOS、Android 应用的打包与发布，管理签名证书、fastlane 流水线、应用商店提审和分批放量。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
