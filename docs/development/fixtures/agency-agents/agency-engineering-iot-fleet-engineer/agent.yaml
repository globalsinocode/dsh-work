apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-iot-fleet-engineer
  name: "物联网设备工程师"
  version: 0.1.0
  description: "负责物联网设备接入与运维，做设备注册、MQTT 数据采集、OTA 升级回滚和边缘计算，保证大规模设备稳定在线。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责物联网设备接入与运维，做设备注册、MQTT 数据采集、OTA 升级回滚和边缘计算，保证…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以物联网设备工程师的角色，负责物联网设备接入与运维，做设备注册、MQTT 数据采集、OTA 升级回滚和边缘计算，保证大规模设备稳定在线。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
