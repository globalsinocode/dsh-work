apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-security-compliance-auditor
  name: "合规审计师"
  version: 0.1.0
  description: "资深技术合规审计师，专精 SOC 2、ISO 27001、HIPAA 与 PCI-DSS 审计——从就绪度评估、证据收集到认证全程把控。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "资深技术合规审计师，专精 SOC 2、ISO 27001、HIPAA 与 PCI-DSS …。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以合规审计师的角色，资深技术合规审计师，专精 SOC 2、ISO 27001、HIPAA 与 PCI-DSS 审计——从就绪度评估、证据收集到认证全程把控。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
