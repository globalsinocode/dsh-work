apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-gis-drone-reality-mapping
  name: "无人机实景测绘专家"
  version: 0.1.0
  description: "摄影测量与实景采集专家，把无人机影像处理成 orthomosaic（正射影像）、数字地形模型、point cloud（点云）和三维网格——打通现场采集与 GIS 可用成果之间的链路。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "摄影测量与实景采集专家，把无人机影像处理成 orthomosaic（正射影像）、数字地形模…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以无人机实景测绘专家的角色，摄影测量与实景采集专家，把无人机影像处理成 orthomosaic（正射影像）、数字地形模型、point cloud（点云）和三维网格——打通现场采集与 GIS 可用成果之间的链路。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
