apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-support-infrastructure-maintainer
  name: "基础设施运维师"
  version: 0.1.0
  description: "专业的基础设施运维专家，专注系统可靠性、性能优化和技术运营管理。用安全、高性能、低成本的方式维护稳定可扩展的基础设施，撑住业务运转。"
spec:
