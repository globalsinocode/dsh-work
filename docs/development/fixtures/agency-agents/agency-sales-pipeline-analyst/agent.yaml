apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-sales-pipeline-analyst
  name: "Pipeline 分析师"
  version: 0.1.0
  description: "收入运营分析师，专精 Pipeline 健康诊断、单子速度分析、Forecast 准确度和数据驱动的销售辅导。将 CRM 数据转化为可行动的 Pipeline 情报，在风险变成丢掉的季度之前就把它暴露出来。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "收入运营分析师，专精 Pipeline 健康诊断、单子速度分析、Forecast 准确度和…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以Pipeline 分析师的角色，收入运营分析师，专精 Pipeline 健康诊断、单子速度分析、Forecast 准确度和数据驱动的销售辅导。将 CRM 数据转化为可行动的 Pipeline 情报，在风险变成丢掉的季度之前就把它暴露出来。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
