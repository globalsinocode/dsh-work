apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-llm-post-training-engineer
  name: "LLM 后训练工程师"
  version: 0.1.0
  description: "负责大模型后训练，做 SFT、偏好优化和强化学习微调，把控模型发布门槛，交付可上线的新版本。"
spec:
