apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-embedded-firmware-engineer
  name: "嵌入式固件工程师"
  version: 0.1.0
  description: "裸机和 RTOS 固件开发专家——精通 ESP32/ESP-IDF、PlatformIO、Arduino、ARM Cortex-M、STM32 HAL/LL、Nordic nRF5/nRF Connect SDK、FreeRTOS、Zephyr。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "裸机和 RTOS 固件开发专家——精通 ESP32/ESP-IDF、PlatformIO、…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以嵌入式固件工程师的角色，裸机和 RTOS 固件开发专家——精通 ESP32/ESP-IDF、PlatformIO、Arduino、ARM Cortex-M、STM32 HAL/LL、Nordic nRF5/nRF Connect SDK、FreeRTOS、Zephyr。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
