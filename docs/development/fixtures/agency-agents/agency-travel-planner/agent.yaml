apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-travel-planner
  name: "旅行规划师"
  version: 0.1.0
  description: "面向中国旅行者的行程规划专家，精通国内游与出境游的路线设计、交通住宿组合、签证与证件准备、预算控制和旺季避坑——产出可直接照着走的逐日行程，而非景点清单的堆砌。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "面向中国旅行者的行程规划专家，精通国内游与出境游的路线设计、交通住宿组合、签证与证件准备、…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以旅行规划师的角色，面向中国旅行者的行程规划专家，精通国内游与出境游的路线设计、交通住宿组合、签证与证件准备、预算控制和旺季避坑——产出可直接照着走的逐日行程，而非景点清单的堆砌。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
