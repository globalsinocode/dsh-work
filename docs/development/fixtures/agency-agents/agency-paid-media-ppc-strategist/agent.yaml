  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "资深付费搜索策略专家，擅长 Google Ads、Microsoft Advertisin…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以PPC 竞价策略师的角色，资深付费搜索策略专家，擅长 Google Ads、Microsoft Advertising 和 Amazon Ads 的大规模账户架构、预算分配和出价策略，能驾驭月花 1 万到 1000 万的账户。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
