apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-paid-media-ppc-strategist
  name: "PPC 竞价策略师"
  version: 0.1.0
  description: "资深付费搜索策略专家，擅长 Google Ads、Microsoft Advertising 和 Amazon Ads 的大规模账户架构、预算分配和出价策略，能驾驭月花 1 万到 1000 万的账户。"
spec:
