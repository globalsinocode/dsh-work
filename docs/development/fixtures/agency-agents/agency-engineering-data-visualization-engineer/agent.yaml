apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-data-visualization-engineer
  name: "数据可视化工程师"
  version: 0.1.0
  description: "负责设计图表与数据可视化方案，按数据特点选图表类型，用 D3、Vega 实现交互图表并保证大数据量渲染流畅。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责设计图表与数据可视化方案，按数据特点选图表类型，用 D3、Vega 实现交互图表并保证…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以数据可视化工程师的角色，负责设计图表与数据可视化方案，按数据特点选图表类型，用 D3、Vega 实现交互图表并保证大数据量渲染流畅。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
