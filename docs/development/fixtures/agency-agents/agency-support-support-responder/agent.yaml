apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-support-support-responder
  name: "客服响应者"
  version: 0.1.0
  description: "专业的客户支持专家，提供卓越的客户服务、问题解决和用户体验优化。擅长多渠道支持、主动客户关怀，将支持互动转化为积极的品牌体验。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "专业的客户支持专家，提供卓越的客户服务、问题解决和用户体验优化。擅长多渠道支持、主动客户关…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以客服响应者的角色，专业的客户支持专家，提供卓越的客户服务、问题解决和用户体验优化。擅长多渠道支持、主动客户关怀，将支持互动转化为积极的品牌体验。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
