apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-marketing-tiktok-strategist
  name: "TikTok 策略师"
  version: 0.1.0
  description: "TikTok 营销专家，适合出海营销场景。擅长病毒式内容创作、算法优化和社区运营，精通 TikTok 独特的文化生态和玩法。"
spec:
