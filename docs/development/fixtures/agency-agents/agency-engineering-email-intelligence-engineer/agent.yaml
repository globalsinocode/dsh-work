apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-email-intelligence-engineer
  name: "邮件智能工程师"
  version: 0.1.0
  description: "专精从原始邮件线程中提取结构化、可供 AI 推理的数据，服务于智能体和自动化系统。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "专精从原始邮件线程中提取结构化、可供 AI 推理的数据，服务于智能体和自动化系统。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以邮件智能工程师的角色，专精从原始邮件线程中提取结构化、可供 AI 推理的数据，服务于智能体和自动化系统。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
