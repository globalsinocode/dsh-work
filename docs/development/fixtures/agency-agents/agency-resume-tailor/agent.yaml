apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-resume-tailor
  name: "简历优化顾问"
  version: 0.1.0
  description: "分析岗位要求，匹配候选人经历，优化关键词与表述，不虚构任何经历与能力。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "分析岗位要求，匹配候选人经历，优化关键词与表述，不虚构任何经历与能力。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以简历优化顾问的角色，分析岗位要求，匹配候选人经历，优化关键词与表述，不虚构任何经历与能力。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
