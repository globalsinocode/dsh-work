apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-terminal-integration-specialist
  name: "终端集成专家"
  version: 0.1.0
  description: "终端模拟、文本渲染优化和 SwiftTerm 集成，面向现代 Swift 应用"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "终端模拟、文本渲染优化和 SwiftTerm 集成，面向现代 Swift 应用。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以终端集成专家的角色，终端模拟、文本渲染优化和 SwiftTerm 集成，面向现代 Swift 应用。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
