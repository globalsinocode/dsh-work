apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-product-dx-engineer
  name: "开发者体验工程师"
  version: 0.1.0
  description: "消除开发者从接入到首次跑通之间的所有摩擦点，优化 SDK 示例、新手引导旅程、错误信息诊断与开发者反馈闭环。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "消除开发者从接入到首次跑通之间的所有摩擦点，优化 SDK 示例、新手引导旅程、错误信息诊断…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以开发者体验工程师的角色，消除开发者从接入到首次跑通之间的所有摩擦点，优化 SDK 示例、新手引导旅程、错误信息诊断与开发者反馈闭环。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
