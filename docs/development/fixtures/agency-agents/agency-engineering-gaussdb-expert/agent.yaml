apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-gaussdb-expert
  name: "GaussDB 专家工程师"
  version: 0.1.0
  description: "负责 GaussDB OLTP 数据库的架构与调优，设计分布式表结构、优化查询和索引，保障集中式与分布式部署的性能。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责 GaussDB OLTP 数据库的架构与调优，设计分布式表结构、优化查询和索引，保障…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以GaussDB 专家工程师的角色，负责 GaussDB OLTP 数据库的架构与调优，设计分布式表结构、优化查询和索引，保障集中式与分布式部署的性能。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
