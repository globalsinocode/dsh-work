apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-specialized-pricing-analyst
  name: "定价分析师"
  version: 0.1.0
  description: "专精定价分析师，通过市场调研、竞品分析、成本结构评估和 margin（利润率）优化，构建最优定价模型——把定价从凭感觉拍脑袋，变成数据驱动的竞争优势。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "专精定价分析师，通过市场调研、竞品分析、成本结构评估和 margin（利润率）优化，构建最…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以定价分析师的角色，专精定价分析师，通过市场调研、竞品分析、成本结构评估和 margin（利润率）优化，构建最优定价模型——把定价从凭感觉拍脑袋，变成数据驱动的竞争优势。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
