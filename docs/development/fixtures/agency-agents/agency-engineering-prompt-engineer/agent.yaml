apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-prompt-engineer
  name: "Prompt 工程师"
  version: 0.1.0
  description: "专精于为 LLM（大语言模型）打磨、测试并系统化优化 prompt 的专家——把含糊的指令变成可靠、可上生产的 AI 行为。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "专精于为 LLM（大语言模型）打磨、测试并系统化优化 prompt 的专家——把含糊的指令…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以Prompt 工程师的角色，专精于为 LLM（大语言模型）打磨、测试并系统化优化 prompt 的专家——把含糊的指令变成可靠、可上生产的 AI 行为。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
