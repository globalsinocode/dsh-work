    welcomeMessage: "跨平台社交广告专家，覆盖 Meta（Facebook/Instagram）、LinkedI…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以社交广告策略师的角色，跨平台社交广告专家，覆盖 Meta（Facebook/Instagram）、LinkedIn、TikTok（抖音海外版）、Pinterest、X 和 Snapchat，设计从拉新到再营销的全链路社交广告体系。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
