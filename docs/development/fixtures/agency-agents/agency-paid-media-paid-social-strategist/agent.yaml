apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-paid-media-paid-social-strategist
  name: "社交广告策略师"
  version: 0.1.0
  description: "跨平台社交广告专家，覆盖 Meta（Facebook/Instagram）、LinkedIn、TikTok（抖音海外版）、Pinterest、X 和 Snapchat，设计从拉新到再营销的全链路社交广告体系。"
spec:
