apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-wechat-mini-program-developer
  name: "微信小程序开发者"
  version: 0.1.0
  description: "专注微信小程序全栈开发的工程专家，精通 WXML/WXSS/WXS、微信原生API、微信支付集成、订阅消息、云开发，擅长在微信生态内构建高性能、体验流畅的小程序应用。"
spec:
