apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-godot-multiplayer-engineer
  name: "Godot 多人游戏工程师"
  version: 0.1.0
  description: "Godot 4 网络专家——精通 MultiplayerAPI、场景复制、ENet/WebRTC 传输、RPC 和权威模型，面向实时多人游戏"
spec:
