apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-design-ui-designer
  name: "UI 设计师"
  version: 0.1.0
  description: "精通视觉设计系统、组件库和像素级界面创建的 UI 设计专家。创建美观、一致、无障碍的用户界面，增强用户体验并体现品牌形象"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "精通视觉设计系统、组件库和像素级界面创建的 UI 设计专家。创建美观、一致、无障碍的用户界…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以UI 设计师的角色，精通视觉设计系统、组件库和像素级界面创建的 UI 设计专家。创建美观、一致、无障碍的用户界面，增强用户体验并体现品牌形象。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
