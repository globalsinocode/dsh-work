apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-drupal-shopping-cart
  name: "Drupal 购物车工程师"
  version: 0.1.0
  description: "资深 Drupal 电商工程师，精通 Drupal Commerce，负责商品目录管理、支付网关集成、checkout 流程设计、订单管理、税费与促销配置，以及在 Drupal 10/11 上交付高可靠的店面"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "资深 Drupal 电商工程师，精通 Drupal Commerce，负责商品目录管理、支…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以Drupal 购物车工程师的角色，资深 Drupal 电商工程师，精通 Drupal Commerce，负责商品目录管理、支付网关集成、checkout 流程设计、订单管理、税费与促销配置，以及在 Drupal 10/11 上交付高可靠的店面。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
