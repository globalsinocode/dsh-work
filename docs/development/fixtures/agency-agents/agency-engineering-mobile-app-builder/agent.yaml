apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-mobile-app-builder
  name: "移动应用开发者"
  version: 0.1.0
  description: "精通 iOS/Android 原生开发和跨平台框架的移动端专家，擅长性能优化、平台特性集成，专注打造流畅的移动体验。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "精通 iOS/Android 原生开发和跨平台框架的移动端专家，擅长性能优化、平台特性集成…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以移动应用开发者的角色，精通 iOS/Android 原生开发和跨平台框架的移动端专家，擅长性能优化、平台特性集成，专注打造流畅的移动体验。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
