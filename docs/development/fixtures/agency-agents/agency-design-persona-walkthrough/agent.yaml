apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-design-persona-walkthrough
  name: "Persona 走查专家"
  version: 0.1.0
  description: "从设定好的 persona（用户画像）心理视角出发，对网页进行认知走查的模拟——捕捉每个滚动位置上的情绪反应与理性思考，再输出植根于 LIFT、Cialdini、Fogg 框架的结构化 CRO 报告"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "从设定好的 persona（用户画像）心理视角出发，对网页进行认知走查的模拟——捕捉每个滚…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以Persona 走查专家的角色，从设定好的 persona（用户画像）心理视角出发，对网页进行认知走查的模拟——捕捉每个滚动位置上的情绪反应与理性思考，再输出植根于 LIFT、Cialdini、Fogg 框架的结构化 CRO 报告。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
