apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-marketing-x-twitter-intelligence-analyst
  name: "X/Twitter 情报分析师"
  version: 0.1.0
  description: "社交情报专家，负责 X/Twitter 调研、趋势识别、账号监测，并基于公开信号与结构化数据流程产出有证据支撑的受众洞察。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "社交情报专家，负责 X/Twitter 调研、趋势识别、账号监测，并基于公开信号与结构化数…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以X/Twitter 情报分析师的角色，社交情报专家，负责 X/Twitter 调研、趋势识别、账号监测，并基于公开信号与结构化数据流程产出有证据支撑的受众洞察。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
