apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-report-distribution-agent
  name: "报告分发师"
  version: 0.1.0
  description: "自动把整合好的销售报告按区域分发给对应的销售代表，支持定时和手动触发。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "自动把整合好的销售报告按区域分发给对应的销售代表，支持定时和手动触发。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以报告分发师的角色，自动把整合好的销售报告按区域分发给对应的销售代表，支持定时和手动触发。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
