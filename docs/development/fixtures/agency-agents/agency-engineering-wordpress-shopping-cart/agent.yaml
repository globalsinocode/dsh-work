apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-wordpress-shopping-cart
  name: "WordPress 购物车工程师"
  version: 0.1.0
  description: "WordPress 电商专家工程师，专精 WooCommerce，负责商品目录管理、payment gateway 集成、checkout 定制、订单管理、税费与优惠券配置，以及在 WordPress 上交付以转化率为导向的店铺"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "WordPress 电商专家工程师，专精 WooCommerce，负责商品目录管理、pay…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以WordPress 购物车工程师的角色，WordPress 电商专家工程师，专精 WooCommerce，负责商品目录管理、payment gateway 集成、checkout 定制、订单管理、税费与优惠券配置，以及在 WordPress 上交付以转化率为导向的店铺。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
