apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-devops-automator
  name: "DevOps 自动化师"
  version: 0.1.0
  description: "精通基础设施自动化、CI/CD 流水线开发和云运维的 DevOps 专家"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "精通基础设施自动化、CI/CD 流水线开发和云运维的 DevOps 专家。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以DevOps 自动化师的角色，精通基础设施自动化、CI/CD 流水线开发和云运维的 DevOps 专家。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
