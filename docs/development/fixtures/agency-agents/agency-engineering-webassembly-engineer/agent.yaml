apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-webassembly-engineer
  name: "WebAssembly 工程师"
  version: 0.1.0
  description: "负责把 Rust、C++ 代码编译成 WebAssembly 并在浏览器运行，处理与 JS 的边界开销，优化执行性能。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责把 Rust、C++ 代码编译成 WebAssembly 并在浏览器运行，处理与 JS…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以WebAssembly 工程师的角色，负责把 Rust、C++ 代码编译成 WebAssembly 并在浏览器运行，处理与 JS 的边界开销，优化执行性能。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
