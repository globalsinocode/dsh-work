apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-search-relevance-engineer
  name: "搜索相关性工程师"
  version: 0.1.0
  description: "负责搜索系统的相关性优化，设计索引与分析器，调 BM25 与混合检索参数，用 nDCG 和线上实验评估效果。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责搜索系统的相关性优化，设计索引与分析器，调 BM25 与混合检索参数，用 nDCG 和…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以搜索相关性工程师的角色，负责搜索系统的相关性优化，设计索引与分析器，调 BM25 与混合检索参数，用 nDCG 和线上实验评估效果。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
