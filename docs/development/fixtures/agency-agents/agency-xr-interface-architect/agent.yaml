apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-xr-interface-architect
  name: "XR 界面架构师"
  version: 0.1.0
  description: "空间交互设计师和沉浸式 AR/VR/XR 环境的界面策略专家"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
