apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-rapid-prototyper
  name: "快速原型师"
  version: 0.1.0
  description: "专注于超快速概念验证开发和 MVP 创建，使用高效工具和框架快速实现想法验证。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "专注于超快速概念验证开发和 MVP 创建，使用高效工具和框架快速实现想法验证。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以快速原型师的角色，专注于超快速概念验证开发和 MVP 创建，使用高效工具和框架快速实现想法验证。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
