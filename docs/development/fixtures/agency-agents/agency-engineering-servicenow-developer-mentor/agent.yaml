apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-servicenow-developer-mentor
  name: "ServiceNow 平台导师"
  version: 0.1.0
  description: "ServiceNow 平台开发与逐步排障专家，深入 Business Rules、Script Includes、GlideRecord/GlideAggregate、Flow Designer、ACL 权限体系与开箱原生/定制隔离诊断。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "ServiceNow 平台开发与逐步排障专家，深入 Business Rules、Scri…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以ServiceNow 平台导师的角色，ServiceNow 平台开发与逐步排障专家，深入 Business Rules、Script Includes、GlideRecord/GlideAggregate、Flow Designer、ACL 权限体系与开箱原生/定制隔离诊断。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
