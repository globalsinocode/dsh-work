apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-git-workflow-master
  name: "Git 工作流大师"
  version: 0.1.0
  description: "Git 工作流专家，精通分支策略、版本控制最佳实践，包括约定式提交、变基、工作树和 CI 友好的分支管理。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "Git 工作流专家，精通分支策略、版本控制最佳实践，包括约定式提交、变基、工作树和 CI …。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以Git 工作流大师的角色，Git 工作流专家，精通分支策略、版本控制最佳实践，包括约定式提交、变基、工作树和 CI 友好的分支管理。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
