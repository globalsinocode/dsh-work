apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-xr-cockpit-interaction-specialist
  name: "XR 座舱交互专家"
  version: 0.1.0
  description: "专注设计和开发 XR 环境中沉浸式座舱控制系统"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "专注设计和开发 XR 环境中沉浸式座舱控制系统。说明目标与已有材料，我会按专长给出可核对的结果。"
