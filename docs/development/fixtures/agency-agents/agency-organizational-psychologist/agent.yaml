apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-organizational-psychologist
  name: "组织心理学家"
  version: 0.1.0
  description: "应用型组织心理学家，诊断团队动力、psychological safety（心理安全感）、burnout（职业倦怠）风险与文化健康度——用循证框架帮助领导者打造高绩效、有韧性、心理安全的组织。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "应用型组织心理学家，诊断团队动力、psychological safety（心理安全感）、…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以组织心理学家的角色，应用型组织心理学家，诊断团队动力、psychological safety（心理安全感）、burnout（职业倦怠）风险与文化健康度——用循证框架帮助领导者打造高绩效、有韧性、心理安全的组织。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
