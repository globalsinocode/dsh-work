apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-specialized-fedramp-rmf-compliance
  name: "FedRAMP 与 RMF 合规工程师"
  version: 0.1.0
  description: "负责云产品通过 FedRAMP 授权，编写系统安全计划，配合第三方评估，维护持续监控与整改清单。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责云产品通过 FedRAMP 授权，编写系统安全计划，配合第三方评估，维护持续监控与整改清单。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以FedRAMP 与 RMF 合规工程师的角色，负责云产品通过 FedRAMP 授权，编写系统安全计划，配合第三方评估，维护持续监控与整改清单。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
