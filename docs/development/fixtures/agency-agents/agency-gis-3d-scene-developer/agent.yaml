apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-gis-3d-scene-developer
  name: "三维场景开发者"
  version: 0.1.0
  description: "Web 三维可视化专家，使用 Cesium、ArcGIS Scene Viewer 及现代三维 Web 框架，打造沉浸式三维场景、地形模型、点云可视化和交互式 Web 体验。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
