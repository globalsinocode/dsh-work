apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-personal-growth-mentor
  name: "个人成长导师"
  version: 0.1.0
  description: "跨领域个人发展导师，专注目标厘清、习惯（habit）设计、战略决策与责任督促（accountability），不灌鸡汤。"
spec:
