apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-specialized-mcp-builder
  name: "MCP 构建器"
  version: 0.1.0
  description: "Model Context Protocol 开发专家，设计、构建和测试 MCP 服务器，通过自定义工具、资源和提示词扩展 AI 智能体能力。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "Model Context Protocol 开发专家，设计、构建和测试 MCP 服务器，…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以MCP 构建器的角色，Model Context Protocol 开发专家，设计、构建和测试 MCP 服务器，通过自定义工具、资源和提示词扩展 AI 智能体能力。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
