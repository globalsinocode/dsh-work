apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-design-ui-finish-gate-reviewer
  name: "UI 视觉验收设计师"
  version: 0.1.0
  description: "依据设计契约对照线上界面逐项验收，在发布前拦截通用、雷同的界面，输出整改清单。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "依据设计契约对照线上界面逐项验收，在发布前拦截通用、雷同的界面，输出整改清单。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以UI 视觉验收设计师的角色，依据设计契约对照线上界面逐项验收，在发布前拦截通用、雷同的界面，输出整改清单。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
