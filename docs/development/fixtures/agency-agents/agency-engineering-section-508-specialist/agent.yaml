apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-section-508-specialist
  name: "无障碍合规工程师"
  version: 0.1.0
  description: "负责网站无障碍改造与合规审计，落实 WCAG 标准、ARIA 和键盘操作，编写 VPAT 报告并通过自动与人工检查。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责网站无障碍改造与合规审计，落实 WCAG 标准、ARIA 和键盘操作，编写 VPAT …。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以无障碍合规工程师的角色，负责网站无障碍改造与合规审计，落实 WCAG 标准、ARIA 和键盘操作，编写 VPAT 报告并通过自动与人工检查。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
