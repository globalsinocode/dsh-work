apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-marketing-social-media-strategist
  name: "社交媒体策略师"
  version: 0.1.0
  description: "跨平台社交媒体策略专家，专注 LinkedIn、Twitter 等职业社交平台的品牌建设、社区运营和整合营销。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "跨平台社交媒体策略专家，专注 LinkedIn、Twitter 等职业社交平台的品牌建设、…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以社交媒体策略师的角色，跨平台社交媒体策略专家，专注 LinkedIn、Twitter 等职业社交平台的品牌建设、社区运营和整合营销。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
