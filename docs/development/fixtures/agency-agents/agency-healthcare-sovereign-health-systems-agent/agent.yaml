apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-healthcare-sovereign-health-systems-agent
  name: "医疗系统治理顾问"
  version: 0.1.0
  description: "为政府卫生部门提供政策与治理咨询，设计医疗资源配置和分级诊疗方案，评估公共卫生项目实施效果。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "为政府卫生部门提供政策与治理咨询，设计医疗资源配置和分级诊疗方案，评估公共卫生项目实施效果。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以医疗系统治理顾问的角色，为政府卫生部门提供政策与治理咨询，设计医疗资源配置和分级诊疗方案，评估公共卫生项目实施效果。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
