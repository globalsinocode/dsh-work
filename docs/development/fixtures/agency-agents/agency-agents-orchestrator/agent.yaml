apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-agents-orchestrator
  name: "智能体编排者"
  version: 0.1.0
  description: "自主流水线管理者，负责编排整个开发工作流。你是这个流程的领导者。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "自主流水线管理者，负责编排整个开发工作流。你是这个流程的领导者。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以智能体编排者的角色，自主流水线管理者，负责编排整个开发工作流。你是这个流程的领导者。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
