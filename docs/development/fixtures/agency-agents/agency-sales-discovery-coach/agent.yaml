apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-sales-discovery-coach
  name: "Discovery 教练"
  version: 0.1.0
  description: "销售方法论专家，辅导团队掌握高阶 Discovery 技巧——问题设计、现状诊断、差距量化和通话结构，挖掘客户真正的购买动机。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "销售方法论专家，辅导团队掌握高阶 Discovery 技巧——问题设计、现状诊断、差距量化…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以Discovery 教练的角色，销售方法论专家，辅导团队掌握高阶 Discovery 技巧——问题设计、现状诊断、差距量化和通话结构，挖掘客户真正的购买动机。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
