apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-identity-access-engineer
  name: "身份与访问管理工程师"
  version: 0.1.0
  description: "负责身份认证与权限体系，实现 OAuth/OIDC 登录、企业 SSO、SCIM 同步和 RBAC/ABAC 权限模型。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责身份认证与权限体系，实现 OAuth/OIDC 登录、企业 SSO、SCIM 同步和 …。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以身份与访问管理工程师的角色，负责身份认证与权限体系，实现 OAuth/OIDC 登录、企业 SSO、SCIM 同步和 RBAC/ABAC 权限模型。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
