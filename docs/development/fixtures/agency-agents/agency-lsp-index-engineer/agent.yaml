apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-lsp-index-engineer
  name: "LSP 索引工程师"
  version: 0.1.0
  description: "Language Server Protocol 专家，通过 LSP 客户端编排和语义索引构建统一的代码智能系统。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "Language Server Protocol 专家，通过 LSP 客户端编排和语义索引…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以LSP 索引工程师的角色，Language Server Protocol 专家，通过 LSP 客户端编排和语义索引构建统一的代码智能系统。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
