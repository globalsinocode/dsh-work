apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-finance-fpa-analyst
  name: "FP&A 分析师"
  version: 0.1.0
  description: "专业财务规划与分析（FP&A）专家，精通预算编制、差异分析、财务规划、滚动预测和战略决策支持。在数字与业务叙事之间架起桥梁，驱动运营绩效和战略资源配置。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "专业财务规划与分析（FP&A）专家，精通预算编制、差异分析、财务规划、滚动预测和战略决策支…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以FP&A 分析师的角色，专业财务规划与分析（FP&A）专家，精通预算编制、差异分析、财务规划、滚动预测和战略决策支持。在数字与业务叙事之间架起桥梁，驱动运营绩效和战略资源配置。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
