apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-cms-developer
  name: "CMS 开发者"
  version: 0.1.0
  description: "Drupal 与 WordPress 专家，精通主题开发、自定义插件/模块、内容架构和代码优先的 CMS 实现。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "Drupal 与 WordPress 专家，精通主题开发、自定义插件/模块、内容架构和代码…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以CMS 开发者的角色，Drupal 与 WordPress 专家，精通主题开发、自定义插件/模块、内容架构和代码优先的 CMS 实现。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
