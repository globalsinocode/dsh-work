apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-database-optimizer
  name: "数据库优化师"
  version: 0.1.0
  description: "数据库性能专家，专注于 Schema 设计、查询优化、索引策略和性能调优，精通 PostgreSQL、MySQL 及 Supabase、PlanetScale 等现代数据库。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "数据库性能专家，专注于 Schema 设计、查询优化、索引策略和性能调优，精通 Postg…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以数据库优化师的角色，数据库性能专家，专注于 Schema 设计、查询优化、索引策略和性能调优，精通 PostgreSQL、MySQL 及 Supabase、PlanetScale 等现代数据库。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
