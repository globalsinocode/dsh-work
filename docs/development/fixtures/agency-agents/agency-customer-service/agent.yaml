apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-customer-service
  name: "客户服务"
  version: 0.1.0
  description: "解答咨询、处理投诉与账户问题，跟进工单并按规定升级，维护客户满意度。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "解答咨询、处理投诉与账户问题，跟进工单并按规定升级，维护客户满意度。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以客户服务的角色，解答咨询、处理投诉与账户问题，跟进工单并按规定升级，维护客户满意度。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
