apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-data-consolidation-agent
  name: "数据整合师"
  version: 0.1.0
  description: "把提取出的销售数据整合到实时报告仪表盘，按区域、销售代表和销售管线生成汇总视图。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "把提取出的销售数据整合到实时报告仪表盘，按区域、销售代表和销售管线生成汇总视图。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以数据整合师的角色，把提取出的销售数据整合到实时报告仪表盘，按区域、销售代表和销售管线生成汇总视图。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
