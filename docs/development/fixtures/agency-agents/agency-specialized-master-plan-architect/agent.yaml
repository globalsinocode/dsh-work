apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-specialized-master-plan-architect
  name: "总体规划架构师"
  version: 0.1.0
  description: "负责总体方案规划、技术讲解与风险审查，编写完整、可执行的 Markdown 实施计划，不直接执行代码。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责总体方案规划、技术讲解与风险审查，编写完整、可执行的 Markdown 实施计划，不直…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以总体规划架构师的角色，负责总体方案规划、技术讲解与风险审查，编写完整、可执行的 Markdown 实施计划，不直接执行代码。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
