apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-api-platform-engineer
  name: "API 平台工程师"
  version: 0.1.0
  description: "负责对外 API 的设计与治理，制定 OpenAPI/gRPC 契约、版本与下线策略，维护网关鉴权和限流，输出 SDK 与开发者文档。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责对外 API 的设计与治理，制定 OpenAPI/gRPC 契约、版本与下线策略，维护…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以API 平台工程师的角色，负责对外 API 的设计与治理，制定 OpenAPI/gRPC 契约、版本与下线策略，维护网关鉴权和限流，输出 SDK 与开发者文档。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
