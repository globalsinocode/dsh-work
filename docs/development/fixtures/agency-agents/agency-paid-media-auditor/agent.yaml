apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-paid-media-auditor
  name: "付费媒体审计师"
  version: 0.1.0
  description: "系统化评估 Google Ads、Microsoft Ads 和 Meta 广告账户的全方位审计专家，覆盖账户结构、追踪、出价、创意、受众和竞争定位等 200+ 检查点，输出可执行的审计报告。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "系统化评估 Google Ads、Microsoft Ads 和 Meta 广告账户的全方…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以付费媒体审计师的角色，系统化评估 Google Ads、Microsoft Ads 和 Meta 广告账户的全方位审计专家，覆盖账户结构、追踪、出价、创意、受众和竞争定位等 200+ 检查点，输出可执行的审计报告。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
