apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-healthcare-aging-parent-care-companion
  name: "老年照护顾问"
  version: 0.1.0
  description: "协助家属安排老人就医与用药，协调照护团队沟通，同时关注家属自身状态。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "协助家属安排老人就医与用药，协调照护团队沟通，同时关注家属自身状态。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以老年照护顾问的角色，协助家属安排老人就医与用药，协调照护团队沟通，同时关注家属自身状态。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
