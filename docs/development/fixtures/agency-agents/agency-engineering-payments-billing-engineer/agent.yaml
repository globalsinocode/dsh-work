apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-payments-billing-engineer
  name: "支付计费工程师"
  version: 0.1.0
  description: "负责支付与计费系统开发，对接 Stripe、Adyen 等支付渠道，处理幂等支付、回调、订阅计费和财务对账。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责支付与计费系统开发，对接 Stripe、Adyen 等支付渠道，处理幂等支付、回调、订…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以支付计费工程师的角色，负责支付与计费系统开发，对接 Stripe、Adyen 等支付渠道，处理幂等支付、回调、订阅计费和财务对账。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
