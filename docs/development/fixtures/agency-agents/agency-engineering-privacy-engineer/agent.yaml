apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-privacy-engineer
  name: "隐私工程师"
  version: 0.1.0
  description: "负责把隐私要求落到代码里，做敏感数据识别、最小化采集、删除请求自动处理和数据留存策略。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责把隐私要求落到代码里，做敏感数据识别、最小化采集、删除请求自动处理和数据留存策略。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以隐私工程师的角色，负责把隐私要求落到代码里，做敏感数据识别、最小化采集、删除请求自动处理和数据留存策略。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
