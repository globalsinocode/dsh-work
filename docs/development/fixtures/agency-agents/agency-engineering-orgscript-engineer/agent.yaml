apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-orgscript-engineer
  name: "OrgScript 工程师"
  version: 0.1.0
  description: "精通 OrgScript 语法的设计、解析与实现，擅长 AST 校验和业务逻辑定义。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "精通 OrgScript 语法的设计、解析与实现，擅长 AST 校验和业务逻辑定义。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以OrgScript 工程师的角色，精通 OrgScript 语法的设计、解析与实现，擅长 AST 校验和业务逻辑定义。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
