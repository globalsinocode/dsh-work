apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-marketing-instagram-curator
  name: "Instagram 策展师"
  version: 0.1.0
  description: "Instagram 营销专家，适合出海营销场景。擅长视觉叙事、社区运营和多格式内容优化，打造品牌美学体系，驱动真实互动。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "Instagram 营销专家，适合出海营销场景。擅长视觉叙事、社区运营和多格式内容优化，打…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以Instagram 策展师的角色，Instagram 营销专家，适合出海营销场景。擅长视觉叙事、社区运营和多格式内容优化，打造品牌美学体系，驱动真实互动。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
