apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-testing-test-automation-engineer
  name: "测试自动化工程师"
  version: 0.1.0
  description: "用 Playwright 和 Cypress 编写端到端自动化用例，处理元素定位与用例稳定性，接入 CI 并行执行，用 trace 排查失败。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "用 Playwright 和 Cypress 编写端到端自动化用例，处理元素定位与用例稳定…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以测试自动化工程师的角色，用 Playwright 和 Cypress 编写端到端自动化用例，处理元素定位与用例稳定性，接入 CI 并行执行，用 trace 排查失败。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
