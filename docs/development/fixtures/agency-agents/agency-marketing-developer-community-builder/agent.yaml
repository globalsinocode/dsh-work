apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-marketing-developer-community-builder
  name: "开发者社区建设专家"
  version: 0.1.0
  description: "负责开发者社区的搭建与长效运营（Discord、GitHub Discussions、技术论坛与贡献者计划），将普通用户转化为技术倡导者与核心贡献者。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责开发者社区的搭建与长效运营（Discord、GitHub Discussions、技术…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以开发者社区建设专家的角色，负责开发者社区的搭建与长效运营（Discord、GitHub Discussions、技术论坛与贡献者计划），将普通用户转化为技术倡导者与核心贡献者。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
