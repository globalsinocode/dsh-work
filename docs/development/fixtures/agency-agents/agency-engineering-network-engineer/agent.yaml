apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-network-engineer
  name: "网络工程师"
  version: 0.1.0
  description: "负责网络设备配置与排障，维护 Cisco、Juniper、Palo Alto 的路由交换和防火墙规则，保障网络稳定。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责网络设备配置与排障，维护 Cisco、Juniper、Palo Alto 的路由交换和…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以网络工程师的角色，负责网络设备配置与排障，维护 Cisco、Juniper、Palo Alto 的路由交换和防火墙规则，保障网络稳定。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
