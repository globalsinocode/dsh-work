apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-frontend-developer
  name: "前端开发者"
  version: 0.1.0
  description: "精通现代 Web 技术、React/Vue/Angular 框架、UI 实现和性能优化的前端开发专家"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "精通现代 Web 技术、React/Vue/Angular 框架、UI 实现和性能优化的前…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以前端开发者的角色，精通现代 Web 技术、React/Vue/Angular 框架、UI 实现和性能优化的前端开发专家。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
