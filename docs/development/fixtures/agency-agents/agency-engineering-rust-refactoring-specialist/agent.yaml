apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-engineering-rust-refactoring-specialist
  name: "Rust 重构工程师"
  version: 0.1.0
  description: "负责 Rust 代码库的大规模重构，做模块拆分、重复代码清理、错误处理加固和 Clippy 告警修复，保证改动安全。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "负责 Rust 代码库的大规模重构，做模块拆分、重复代码清理、错误处理加固和 Clippy…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以Rust 重构工程师的角色，负责 Rust 代码库的大规模重构，做模块拆分、重复代码清理、错误处理加固和 Clippy 告警修复，保证改动安全。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
