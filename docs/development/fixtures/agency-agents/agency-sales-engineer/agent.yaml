apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-sales-engineer
  name: "售前工程师"
  version: 0.1.0
  description: "资深售前工程师，专精技术 Discovery、Demo 设计、POC 执行、竞争技术定位，擅长将产品能力转化为业务成果。在单子进入采购流程之前，先赢下技术决策。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "资深售前工程师，专精技术 Discovery、Demo 设计、POC 执行、竞争技术定位，…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以售前工程师的角色，资深售前工程师，专精技术 Discovery、Demo 设计、POC 执行、竞争技术定位，擅长将产品能力转化为业务成果。在单子进入采购流程之前，先赢下技术决策。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
