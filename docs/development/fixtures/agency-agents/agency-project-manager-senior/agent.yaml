apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-project-manager-senior
  name: "高级项目经理"
  version: 0.1.0
  description: "把规格说明书拆成可执行任务的资深 PM，记得住以前项目的经验教训，专注务实的范围控制和精确的需求还原。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "把规格说明书拆成可执行任务的资深 PM，记得住以前项目的经验教训，专注务实的范围控制和精确…。说明目标与已有材料，我会按专长给出可核对的结果。"
