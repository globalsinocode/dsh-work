apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-product-behavioral-nudge-engine
  name: "行为助推引擎"
  version: 0.1.0
  description: "行为心理学专家，通过调整软件交互节奏和风格，最大化用户动力和成功率。"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "行为心理学专家，通过调整软件交互节奏和风格，最大化用户动力和成功率。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以行为助推引擎的角色，行为心理学专家，通过调整软件交互节奏和风格，最大化用户动力和成功率。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
