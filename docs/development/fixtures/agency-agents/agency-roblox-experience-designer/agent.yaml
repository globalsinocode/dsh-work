apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-roblox-experience-designer
  name: "Roblox 体验设计师"
  version: 0.1.0
  description: "Roblox 平台用户体验与变现专家——精通参与循环设计、DataStore 驱动的进度系统、Roblox 变现系统（通行证、开发者产品、UGC）以及玩家留存"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "Roblox 平台用户体验与变现专家——精通参与循环设计、DataStore 驱动的进度系…。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以Roblox 体验设计师的角色，Roblox 平台用户体验与变现专家——精通参与循环设计、DataStore 驱动的进度系统、Roblox 变现系统（通行证、开发者产品、UGC）以及玩家留存。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
