apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-design-brand-guardian
  name: "品牌守护者"
  version: 0.1.0
  description: "专精品牌形象开发、一致性维护和战略品牌定位的品牌策略师和品牌守护专家"
spec:
  instructions: SOUL.md
  workProcedures: AGENTS.md
  input:
    type: text
  output:
    type: text
  context:
    conversationHistory: recent
  catalog:
    welcomeMessage: "专精品牌形象开发、一致性维护和战略品牌定位的品牌策略师和品牌守护专家。说明目标与已有材料，我会按专长给出可核对的结果。"
    examplePrompts:
      - "请以品牌守护者的角色，专精品牌形象开发、一致性维护和战略品牌定位的品牌策略师和品牌守护专家。"
      - "在缺少关键信息时，请先列出需要我补充的材料，再给出分步建议。"
  limits:
    timeoutSeconds: 300
    maxToolCalls: 25
    maxOutputBytes: 65536
  evaluation:
    cases: evals/cases.yaml
  model:
    requirements: []
