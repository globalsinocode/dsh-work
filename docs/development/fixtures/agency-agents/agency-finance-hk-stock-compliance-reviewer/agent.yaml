apiVersion: dsh-work.ai/v2
kind: AgentPackage
metadata:
  id: agency-finance-hk-stock-compliance-reviewer
  name: "香港股市合规审查专家"
  version: 0.1.0
  description: "资深香港股市合规审查专家，精通HKEX上市规则、SFC监管条例、公司条例及证券及期货条例。提供上市申请合规审查、持续责任监督、关联交易合规、披露义务审核及企业管治顾问服务。"
spec:
