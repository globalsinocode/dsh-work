<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Han characters default to Simplified Chinese glyphs. Documents written by python-docx and similar
  tools rarely declare an East Asian language, and fontconfig then picks among the Noto CJK regional
  variants arbitrarily (the first image build rendered Chinese with the Hong Kong variant).

  LibreOffice asks fontconfig for a Han fallback with the language "zh", which none of Debian's
  70-fonts-noto-cjk.conf rules match (they test zh-cn, zh-tw, zh-hk, ja and ko exactly). The SC
  families are appended last with strong binding: earlier families still win for characters they
  cover, and among the CJK fonts that cover a Han character the strong SC binding outranks the
  language score. Text tagged Japanese, Korean or Traditional Chinese keeps its regional variant
  through Debian's rules. The exclusions use exact not_eq: with not_contains, a bare "zh" given as a
  language set would count as containing zh-tw. A pattern without a language passes qual="all".
-->
<fontconfig>
  <match target="pattern">
    <test qual="all" name="lang" compare="not_eq"><string>ja</string></test>
    <test qual="all" name="lang" compare="not_eq"><string>ko</string></test>
    <test qual="all" name="lang" compare="not_eq"><string>zh-tw</string></test>
    <test qual="all" name="lang" compare="not_eq"><string>zh-hk</string></test>
    <test qual="all" name="lang" compare="not_eq"><string>zh-mo</string></test>
    <test qual="any" name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="all" name="lang" compare="not_eq"><string>ja</string></test>
    <test qual="all" name="lang" compare="not_eq"><string>ko</string></test>
    <test qual="all" name="lang" compare="not_eq"><string>zh-tw</string></test>
    <test qual="all" name="lang" compare="not_eq"><string>zh-hk</string></test>
    <test qual="all" name="lang" compare="not_eq"><string>zh-mo</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
</fontconfig>
