# Full stack in Docker: PostgreSQL + API/DSH server + HTTPS nginx (static frontends).
# Not the Mac mini launchd layout — everything runs in containers.
#
# Setup:
#   cp deploy/docker/stack.env.example deploy/docker/stack.env
#   # edit stack.env (passwords, DSH_WORK_ACP_*, session secret, model creds in DSH_HOME)
#   pnpm docker:tls
#   pnpm docker:up
#
# Open: https://localhost:4174/workbench  https://localhost:4180/overview
# (accept self-signed certificate)
#
# Dev hot reload (bind mount): pnpm dev:docker — see deploy/dsh-work.compose.yaml

name: dsh-work

services:
  postgres:
    image: ${DSH_WORK_POSTGRES_IMAGE:-postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
    container_name: dsh-work-postgres
    environment:
      POSTGRES_DB: ${DSH_WORK_POSTGRES_DB:-dsh_work}
      POSTGRES_USER: ${DSH_WORK_POSTGRES_USER:-dsh_work}
      POSTGRES_PASSWORD: ${DSH_WORK_POSTGRES_PASSWORD:?Set DSH_WORK_POSTGRES_PASSWORD in deploy/docker/stack.env}
    volumes:
      - dsh-work-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: server
      args:
        DSH_CLIENT_COMMIT_HASH: ${DSH_CLIENT_COMMIT_HASH:-0000000}
    image: dsh-work/server:latest
    container_name: dsh-work-server
    env_file:
      - stack.env
    environment:
      DSH_WORK_SERVER_HOST: 0.0.0.0
      DSH_WORK_DATABASE_URL: postgres://${DSH_WORK_POSTGRES_USER:-dsh_work}:${DSH_WORK_POSTGRES_PASSWORD}@postgres:5432/${DSH_WORK_POSTGRES_DB:-dsh_work}
      DSH_RUNTIME_HOME: /app/deploy/deepseek-harness
      # Harness 打进镜像时无 .git，用 runtime-lock 生成的 dsh-runtime.json + 显式启动命令。
      DSH_RUNTIME_COMMAND: /usr/local/bin/node
      DSH_RUNTIME_ARGS_JSON: '["--import","tsx/esm","apps/cli/lib/bin.js"]'
      DSH_HOME: /app/deploy/.dsh
      DSH_WORK_DATA_ROOT: /app/data
      DSH_WORK_DSH_SESSIONS_ROOT: /app/data/dsh-sessions
    volumes:
      - dsh-work-app-data:/app/data
      - dsh-work-dsh-home:/app/deploy/.dsh
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:4190/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: web
      args:
        DSH_CLIENT_COMMIT_HASH: ${DSH_CLIENT_COMMIT_HASH:-0000000}
    image: dsh-work/web:latest
    container_name: dsh-work-web
    env_file:
      - stack.env
    environment:
      DSH_WORK_NGINX_UPSTREAM_HOST: server
      DSH_WORK_NGINX_DNS_RESOLVER: 127.0.0.11
      DSH_WORK_SERVER_PORT: ${DSH_WORK_SERVER_PORT:-4190}
      DSH_WORK_WORKBENCH_SERVER_NAMES: ${DSH_WORK_WORKBENCH_SERVER_NAMES:-localhost}
      DSH_WORK_ADMIN_SERVER_NAMES: ${DSH_WORK_ADMIN_SERVER_NAMES:-localhost}
      DSH_WORK_HEALTHCHECK_HOST: ${DSH_WORK_HEALTHCHECK_HOST:-localhost}
    volumes:
      - type: bind
        source: ./tls/server.crt
        target: /etc/dsh-work/tls/server.crt
        read_only: true
      - type: bind
        source: ./tls/server.key
        target: /etc/dsh-work/tls/server.key
        read_only: true
    ports:
      - '${DSH_WORK_WORKBENCH_HTTPS_PORT:-4174}:8443'
      - '${DSH_WORK_ADMIN_HTTPS_PORT:-4180}:8444'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --no-check-certificate --header="Host: $${DSH_WORK_HEALTHCHECK_HOST}" --spider https://127.0.0.1:8443/health/live',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  dsh-work-postgres-data:
  dsh-work-app-data:
  dsh-work-dsh-home:
