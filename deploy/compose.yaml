name: dsh-work

services:
  postgres:
    image: ${DSH_WORK_POSTGRES_IMAGE:-postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
    environment:
      POSTGRES_DB: ${DSH_WORK_POSTGRES_DB:?Set DSH_WORK_POSTGRES_DB in runtime.env}
      POSTGRES_USER: ${DSH_WORK_POSTGRES_USER:?Set DSH_WORK_POSTGRES_USER in runtime.env}
      POSTGRES_PASSWORD: ${DSH_WORK_POSTGRES_PASSWORD:?Set DSH_WORK_POSTGRES_PASSWORD in runtime.env}
    ports:
      - "127.0.0.1:${DSH_WORK_POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    image: ${DSH_WORK_NGINX_IMAGE:-nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46}
    environment:
      DSH_WORK_SERVER_PORT: ${DSH_WORK_SERVER_PORT:-4190}
      # nginx 上游解析（站点可覆盖）。注意不要复用 DSH_WORK_SERVER_HOST：
      # 那是服务自身的绑定地址，preflight 断言它必须是 127.0.0.1，
      # 透传给容器会让 nginx 打到容器自己的 loopback（站点直接 502）。
      DSH_WORK_NGINX_UPSTREAM_HOST: ${DSH_WORK_NGINX_UPSTREAM_HOST:-host.docker.internal}
      DSH_WORK_NGINX_DNS_RESOLVER: ${DSH_WORK_NGINX_DNS_RESOLVER:-127.0.0.11}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${DSH_WORK_DEPLOY_ROOT:?Set DSH_WORK_DEPLOY_ROOT in runtime.env}/current/apps/workbench-web/dist
        target: /srv/workbench
        read_only: true
      - type: bind
        source: ${DSH_WORK_DEPLOY_ROOT:?Set DSH_WORK_DEPLOY_ROOT in runtime.env}/current/apps/admin-web/dist
        target: /srv/admin
        read_only: true
      - type: bind
        source: ${DSH_WORK_DEPLOY_ROOT:?Set DSH_WORK_DEPLOY_ROOT in runtime.env}/current/deploy/nginx/default.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
      - type: bind
        source: ${DSH_WORK_DEPLOY_ROOT:?Set DSH_WORK_DEPLOY_ROOT in runtime.env}/current/deploy/nginx/proxy_params
        target: /etc/nginx/proxy_params
        read_only: true
      - type: bind
        source: ${DSH_WORK_TLS_CERT_FILE:?Set DSH_WORK_TLS_CERT_FILE in runtime.env}
        target: /etc/dsh-work/tls/server.crt
        read_only: true
      - type: bind
        source: ${DSH_WORK_TLS_KEY_FILE:?Set DSH_WORK_TLS_KEY_FILE in runtime.env}
        target: /etc/dsh-work/tls/server.key
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --no-check-certificate --header=\"Host: $${DSH_WORK_HEALTHCHECK_HOST}\" --spider https://127.0.0.1:8443/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
