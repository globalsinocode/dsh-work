# Local dev: one container, bind-mounted sources, Vite HMR. Do not run with `pnpm docker:up` (port clash).
name: dsh-work-dev

services:
  dsh-work-dev:
    build:
      context: ..
      dockerfile: deploy/dsh-work.Dockerfile
    image: dsh-work:dev-hot
    container_name: dsh-work-dev-hot
    env_file:
      - ../.env
    environment:
      DSH_WORK_SERVER_HOST: 0.0.0.0
      DSH_WORK_SERVER_PORT: ${DSH_WORK_SERVER_PORT:-4190}
      DSH_WORK_WORKBENCH_PORT: ${DSH_WORK_WORKBENCH_PORT:-4174}
      DSH_WORK_ADMIN_PORT: ${DSH_WORK_ADMIN_PORT:-4180}
      DSH_WORK_DOCKER_DEV: "1"
      DSH_RUNTIME_HOME: /work/deploy/deepseek-harness
      DSH_HOME: /work/deploy/.dsh
    volumes:
      - ..:/work:cached
      - ../deploy/deepseek-harness:/work/deploy/deepseek-harness-seed:ro,cached
      - dsh-work-harness-linux:/work/deploy/deepseek-harness
      - dsh-work-node-modules:/work/node_modules
      - dsh-work-dsh-node-modules:/work/deploy/deepseek-harness/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DSH_WORK_WORKBENCH_PORT:-4174}:${DSH_WORK_WORKBENCH_PORT:-4174}"
      - "${DSH_WORK_ADMIN_PORT:-4180}:${DSH_WORK_ADMIN_PORT:-4180}"
      - "${DSH_WORK_SERVER_PORT:-4190}:${DSH_WORK_SERVER_PORT:-4190}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /work
    user: "0:0"
    restart: unless-stopped

volumes:
  dsh-work-node-modules:
  dsh-work-dsh-node-modules:
  dsh-work-harness-linux:
