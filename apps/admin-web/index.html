<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="dsh-work 企业 AI 平台管理后台" />
    <title>dsh-work · 管理后台</title>
    <script>
      // 错误记录（OBS-S1 / OB13）：应用代码没能运行时（脚本或样式加载失败、15 秒内未挂载）直接上报白屏。
      // 不依赖打包代码；应用挂载后由 main.ts 置 __DSH_APP_MOUNTED__，此后由应用内上报器接手。
      (function () {
        var app = 'admin'
        var sent = 0
        function send(message) {
          if (window.__DSH_APP_MOUNTED__ || sent >= 3) return
          sent += 1
          try {
            var body = JSON.stringify({ app: app, reports: [{ kind: 'load', message: message }] })
            var url = '/auth/' + app + '/client-errors'
            var blob = new Blob([body], { type: 'text/plain;charset=UTF-8' })
            if (!(navigator.sendBeacon && navigator.sendBeacon(url, blob))) {
              fetch(url, { method: 'POST', body: body, keepalive: true, credentials: 'include', headers: { 'Content-Type': 'text/plain;charset=UTF-8' } })['catch'](function () {})
            }
          } catch (error) {}
        }
        window.addEventListener('error', function (event) {
          var target = event.target
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            send('启动时' + (target.tagName === 'SCRIPT' ? '脚本' : '样式') + '加载失败')
          }
        }, true)
        setTimeout(function () { send('页面 15 秒内未完成加载（白屏）') }, 15000)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
