# dsh-work patch over the official `dsh --profile acp` composition. The base
# profile owns settings, credentials, tools and sandboxing; this final layer
# supplies the product prompt, model route, persistence root and tool policy.
# Secrets remain in DSH_HOME and are never copied into this file.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: !!js process.env.DSH_AGENT_SYSTEM_PROMPT ?? 'You are the dsh-work enterprise assistant.'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? process.env.DSH_WORK_DSH_SESSIONS_ROOT ?? dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: acp
  name: '@deepseek-ai/dsh-acp'
  # 刻意留空：provider/model 在 @deepseek-ai/dsh-acp 里是可选字段，缺失时
  # agentOptions() 不传该字段、initialSelection() 返回 undefined，
  # 路由回落到 DSH 的 agent-default-model（站点真源：~/.dsh/settings.yaml）。
  # 站点不再把模型路由写进制品；需要覆盖时请改 DSH 设置，而不是改这个文件。
  config: {}

- insert:
    - id: dsh-work-tool-policy
      # Replaced with an absolute path in the generated deployment overlay.
      name: __DSH_WORK_TOOL_POLICY_MODULE__
