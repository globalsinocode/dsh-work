# dsh-work patch over the official `dsh --profile acp` composition. The base
# profile owns settings, credentials, tools and sandboxing; this layer supplies
# the product prompt, persistence root and tool policy. Formal Attempts append a
# per-Attempt patch (model routing plan 4.4) that overrides `acp` with the
# platform default route, points pi-ai and web search at the platform model
# gateway with an Attempt token, and isolates `settings.path`. The `acp`
# provider/model below only serve the tool catalog and MCP inspection probes,
# which stop at session/new and never send a model request. No secret is ever
# written to this file.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: !!js process.env.DSH_AGENT_SYSTEM_PROMPT ?? 'You are the dsh-work enterprise assistant.'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? process.env.DSH_WORK_DSH_SESSIONS_ROOT ?? dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: acp
  name: '@deepseek-ai/dsh-acp'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- insert:
    - id: dsh-work-tool-policy
      # Replaced with an absolute path in the generated deployment overlay.
      name: __DSH_WORK_TOOL_POLICY_MODULE__
