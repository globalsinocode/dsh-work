# Development-only dsh-work composition for DSH 0.1.1-rc.2. That Runtime does
# not ship the official `acp` profile, so it must include the verified legacy
# ACP example and patch its agent. Secrets remain in DSH_HOME.
- id: base
  name: cordis:include
  config:
    path: __DSH_ACP_BASE_CONFIG__
    patches:
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          # provider/model 留空，由 DSH 的 agent-default-model 决定（同正式路径）。
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? process.env.DSH_WORK_DSH_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
          workspaceContext:
            maxBytes: 65536
          persona: !!js "process.env.DSH_AGENT_SYSTEM_PROMPT ?? 'You are the dsh-work enterprise assistant.'"
      - insert:
          - id: settings
            name: '@deepseek-ai/dsh-settings-file'
          - id: credentials
            name: '@deepseek-ai/dsh-credentials-local'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: dsh-work-tool-policy
            name: __DSH_WORK_TOOL_POLICY_MODULE__
