name: Sync upstream

on:
  schedule:
    - cron: "0 */6 * * *" # 每 6 小时，UTC
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'globalsinocode/dsh-work' && github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fast-forward main from parent
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: gh repo sync "${{ github.repository }}" -b main
