name: Manual release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Date-based releaseVersion from server/package.json, without the v prefix (YYYY.MM.DD-NN)
        required: true
        type: string

permissions:
  contents: write
  checks: read
  id-token: write
  attestations: write

concurrency:
  group: manual-release
  cancel-in-progress: false

jobs:
  package:
    name: Build approved Mac mini release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a releasable branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          # 白名单：main（上游/镜像发布线）与我们自己的 release/* 副分支发布线。
          # 白名单而不是"只认副分支"，是为了保留以后继续安装上游官方 Release 的能力。
          case "${SELECTED_REF}" in
            refs/heads/main|refs/heads/release/*) ;;
            *) echo "release must be dispatched from main or release/*: ${SELECTED_REF}" >&2; exit 1 ;;
          esac

      - name: Check out the selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require a stable release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bash scripts/deploy/release-version.sh "${RELEASE_VERSION}"

      - name: Refuse Release or Tag reuse
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${tag}" >&2
            exit 1
          fi
          existing_tag="$(git ls-remote --tags --refs origin "refs/tags/${tag}")"
          test -z "${existing_tag}" \
            || { echo "Git tag already exists: ${tag}" >&2; exit 1; }

      - name: Require the commit CI gate to have passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "M6 quality gate")][0].conclusion // ""')
          test "${conclusion}" = "success"

      - name: Set up locked pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.18.1
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build immutable release archive
        id: build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bash scripts/release/build-release.sh "${RELEASE_VERSION}"
          echo "archive=${GITHUB_WORKSPACE}/dist/releases/dsh-work-v${RELEASE_VERSION}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Attest GitHub-hosted build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.build.outputs.archive }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          archive="dist/releases/dsh-work-${tag}.tar.gz"
          checksum="${archive}.sha256"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${tag}" >&2
            exit 1
          fi
          gh release create "${tag}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "dsh-work ${tag}" \
            --notes "Manually approved, attested Mac mini release for commit ${GITHUB_SHA}. The Mac mini public Release watcher deploys it automatically after publication."
          release_target=$(gh release view "${tag}" --json targetCommitish --jq .targetCommitish)
          test "${release_target}" = "${GITHUB_SHA}" \
            || { echo "Draft Release target mismatch: ${release_target}" >&2; exit 1; }
          gh release upload "${tag}" "${archive}" "${checksum}"
          gh release edit "${tag}" --draft=false --latest
          test "$(gh release view "${tag}" --json isImmutable --jq .isImmutable)" = true \
            || { echo "Release immutability is not enabled for ${tag}" >&2; exit 1; }
          gh release verify "${tag}"
