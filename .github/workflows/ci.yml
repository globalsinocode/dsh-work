name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: M6 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dsh_work
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: dsh_work_m3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsh_work -d dsh_work_m3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment configuration
        run: bash scripts/ci/deploy.sh

      - name: Run quality gate
        run: pnpm ci:check

      - name: Run review unit regression
        run: pnpm test:review:unit

      - name: Run review PostgreSQL regression
        env:
          DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
        run: pnpm test:review:integration

      - name: Run review batch02 unit regression
        run: pnpm test:review:batch02:unit

      - name: Run review batch02 PostgreSQL regression
        env:
          DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
        run: pnpm test:review:batch02:integration

      - name: Run scenario trial regression
        env:
          DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
        run: pnpm test:review:8b:unit && pnpm test:review:8b:integration

      - name: Run personal workbench integration regression
        env:
          DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
        run: pnpm test:review:batch03:integration

      - name: Run low-risk admin confirmation regression
        env:
          DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
        run: pnpm test:review:c6:unit && pnpm test:review:c6:integration

      - name: Run deterministic link import regression
        env:
          DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
        run: pnpm test:review:c7:unit && pnpm test:review:c7:integration

      - name: Run P2 request-origin error regression
        run: pnpm test:review:p2:origin

      - name: Run PostgreSQL integration tests
        env:
          DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
        run: pnpm test:m2:integration && pnpm test:m3:integration && pnpm test:m4:integration && pnpm test:m4:skill:integration && pnpm test:skill-install:integration && pnpm test:m4:tool:integration && pnpm test:m4:knowledge:integration && pnpm test:m4:file:integration && pnpm test:m4:authorization:integration && pnpm test:m4:runtime:integration && pnpm test:m4:audit:integration && pnpm test:m4:error:integration && pnpm test:m5:security:integration && pnpm test:m5:faults:integration && pnpm test:m5:capacity:integration && pnpm test:m4:team-auth:integration && pnpm test:m5:members:integration && pnpm test:m5:workspace:integration && pnpm test:m5:workspace:upgrade:integration && pnpm test:m5:agent-members:integration && pnpm test:m5:sessions:integration && pnpm test:m5:shared-files:integration && pnpm test:m5:file-versions:integration && pnpm test:m5:lifecycle:integration && pnpm test:m5:activity:integration && pnpm test:m5:usage:integration && pnpm test:m5:reconciliation:integration && pnpm test:m5:revocation:integration && pnpm test:sso:integration

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Run personal workbench P1 browser journeys
        env:
          DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
        run: pnpm test:e2e:personal
