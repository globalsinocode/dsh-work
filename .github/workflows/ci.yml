name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Four independent jobs run in parallel. Server tests are selected by file name:
# *.integration.test.ts → test:integration (PostgreSQL), other *.test.ts → test:unit.
jobs:
  static:
    name: Static checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment configuration
        run: bash scripts/ci/deploy.sh

      - name: Run static checks, type checks, lint and build
        run: pnpm ci:static

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server and frontend unit tests
        run: pnpm ci:unit

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dsh_work
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: dsh_work_m3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsh_work -d dsh_work_m3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all server integration suites
        run: pnpm test:integration

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_WORK_TEST_DATABASE_URL: postgres://dsh_work:ci_only_password@127.0.0.1:5432/dsh_work_m3_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dsh_work
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: dsh_work_m3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsh_work -d dsh_work_m3_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run P0 browser smoke tests
        run: pnpm test:e2e

      - name: Run local authentication P1 browser journeys
        run: pnpm test:e2e:local-auth

      - name: Run login options and independent accounts P1 browser journeys
        run: pnpm test:e2e:login-options

      - name: Run personal workbench P1 browser journeys
        run: pnpm test:e2e:personal

      - name: Run MCP administration P1 browser journey
        run: pnpm test:e2e:mcp-admin

      - name: Run automation P1 browser journeys
        run: pnpm test:e2e:automation

      - name: Run Agent Principal P1 browser journey
        run: pnpm test:e2e:agent-principal

      - name: Run Agent capability P1 browser journey
        run: pnpm test:e2e:agent-capabilities

      - name: Run Agent routine P1 browser journey
        run: pnpm test:e2e:agent-routines
