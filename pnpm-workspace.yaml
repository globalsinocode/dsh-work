packages:
  - apps/*
  - packages/*
  - server

confirmModulesPurge: false
allowBuilds:
  esbuild: true

packageExtensions:
  '@vitejs/plugin-vue':
    dependencies:
      vue: ^3.5.41

# Vitest + @vitejs/plugin-vue 需在同一可见性下解析 vue 与 compiler 子包（不整仓 shamefully-hoist）。
publicHoistPattern:
  - vue
  - '@vue/*'
